name: Verify shared UI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    env:
      # I vettori crittografici devono girare davvero: senza cryptography il test fallisce invece di essere saltato.
      CYCLING_SUITE_REQUIRE_CRYPTO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Stessa versione dei lockfile di Fuorigiri e Ammiraglia.
      - run: python -m pip install cryptography==50.0.2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run pack:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cycling-suite-ui
          path: artifacts/*.tgz
